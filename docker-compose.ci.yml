services:
  postgres:
    image: postgres:16.6-bullseye
    restart: unless-stopped
    networks:
      - bms-e2e-test-network
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bms
    logging:
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready', '-U', 'postgres', '-d', 'bms']
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    networks:
      - bms-e2e-test-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging:
      options:
        max-size: '10m'
        max-file: '3'
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    networks:
      - bms-e2e-test-network
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: lumivn274
    logging:
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 5
  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - bms-e2e-test-network
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 admin lumivn274;
      /usr/bin/mc mb myminio/hc-logs;
      /usr/bin/mc mb myminio/cctv-storage;
      exit 0;
      "
  clickhouse:
    image: clickhouse/clickhouse-server:24.11-alpine
    restart: unless-stopped
    networks:
      - bms-e2e-test-network
    environment:
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: 123456
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      TZ: Asia/Saigon
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://127.0.0.1:8123/ping',
        ]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - ./infra/config/clickhouse.xml:/etc/clickhouse-server/config.xml:ro
  init-clickhouse:
    image: clickhouse/clickhouse-server:24.11-alpine
    networks:
      - bms-e2e-test-network
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - ./infra/data/clickhouse:/docker-entrypoint-initdb.d/sql:ro
    entrypoint: >
      /bin/sh -c "
        echo 'Running ClickHouse SQL files...' &&
        for f in /docker-entrypoint-initdb.d/sql/*.sql; do
          [ -f \"$$f\" ] || continue;
          echo \"Executing $$f\" &&
          clickhouse-client --host clickhouse --user admin --password 123456 --multiquery < \"$$f\" || exit 1;
        done &&
        echo 'All ClickHouse SQL files executed.'
      "
    restart: 'no'
  iot-console-healthcheck:
    image: alpine
    networks:
      - bms-e2e-test-network
    depends_on:
      iot-console:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
        apk add --no-cache wget > /dev/null 2>&1 &&
        until wget -qO- http://iot-console:3333/api/health > /dev/null 2>&1; do
          echo 'Waiting for iot-console...';
          sleep 3;
        done;
        echo 'iot-console is healthy!'
      "
    restart: 'no'
  db-init:
    image: postgres:16.6-bullseye
    networks:
      - bms-e2e-test-network
    depends_on:
      iot-console-healthcheck:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: bms
    volumes:
      - ./infra/data/postgres:/docker-entrypoint-initdb.d/sql:ro
    command: >
      bash -c "
        echo 'Running SQL files...' &&
        for f in /docker-entrypoint-initdb.d/sql/*.sql; do
          echo \"Executing $$f\" &&
          psql -f \"$$f\" || exit 1;
        done &&
        echo 'All SQL files executed.'
      "
    restart: 'no'
  iot-console:
    image: lumivn/iot-console-msb:__IOT_CONSOLE__VERSION__
    ports:
      - '3333:3333'
    networks:
      - bms-e2e-test-network
    depends_on:
      postgres:
        condition: service_healthy
      init-clickhouse:
        condition: service_completed_successfully
      createbuckets:
        condition: service_completed_successfully
    environment:
      RUST_LOG: 'info'
      IOT_CONSOLE_BIND: '0.0.0.0:3333'

      # Database is controlled here. Replace with Postgres if needed:
      DATABASE_URL: 'postgres://postgres:postgres@postgres:5432/bms'
      #DATABASE_URL: "sqlite:///data/iot-console.db?mode=rwc"

      # Toggle migrations directly in compose (true/false)
      IOT_CONSOLE_RUN_MIGRATIONS: 'true'

      # Required if you turn migrations on
      ROOT_ADMIN_ID: fb5a2f2c-e504-4309-8ce6-a4668e293e12
      ROOT_ADMIN_USERNAME: root
      ROOT_ADMIN_PASSWORD: Lumi@456

      IOT_CONSOLE_HC_LOG_UPLOAD_API_KEY: 8dlvRb4jJw6eeBAk4wp6SWc6beXgqIAj
      IOT_CONSOLE_HOOK_SECRET: 8dlvRb4jJw6eeBAk4wp6SWc6beQWERTY

      # S3/MinIO storage used to generate presigned upload URLs.
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: lumivn274
      MINIO_BUCKET: hc-logs
      MINIO_REGION: us-east-1
      MINIO_PUBLIC_URL: http://minio:9000/hc-logs
      CLICKHOUSE_ENDPOINT: http://clickhouse:8123/iot_metrics
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: 123456
      CLICKHOUSE_BATCH_INSERT_SIZE: 100
      CLICKHOUSE_BATCH_INSERT_PERIOD_SEC: 5
    restart: unless-stopped
    logging:
      options:
        max-size: '10m'
        max-file: '3'
  emqx:
    image: emqx/emqx:5.8.8
    restart: unless-stopped
    networks:
      - bms-e2e-test-network
    depends_on:
      iot-console-healthcheck:
        condition: service_completed_successfully
    volumes:
      - ./infra/config/emqx.conf:/opt/emqx/etc/emqx.conf:ro
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:18083/status']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      options:
        max-size: '10m'
        max-file: '3'
  iot-logging:
    image: lumivn/platform-v3-logging:__IOT_LOG_VERSION__
    restart: unless-stopped
    ports:
      - 4420:4420
    networks:
      - bms-e2e-test-network
    depends_on:
      init-clickhouse:
        condition: service_completed_successfully
      db-init:
        condition: service_completed_successfully
      emqx:
        condition: service_healthy
    environment:
      MQTT_ADDR: mqtt://emqx:1883
      HTTP_ADDR: 0.0.0.0:4420
      DATABASE_ENDPOINT: 'postgres://postgres:postgres@postgres:5432/bms'
      CLICKHOUSE_ADDR: http://admin:123456@clickhouse:8123/iot_logging
      CLICKHOUSE_BATCH_INSERT_SIZE: 100
      CLICKHOUSE_BATCH_INSERT_PERIOD_SEC: 1
    logging:
      options:
        max-size: '10m'
        max-file: '3'
  metrics-devices:
    image: lumivn/metrics-gw-msb:__METRICS_GW_VERSION__
    restart: unless-stopped
    ports:
      - '3334:3334'
    networks:
      - bms-e2e-test-network
    depends_on:
      iot-console-healthcheck:
        condition: service_completed_successfully
      init-clickhouse:
        condition: service_completed_successfully
      emqx:
        condition: service_healthy
    environment:
      RUST_LOG: info
      HTTP_ADDR: 0.0.0.0:3334
      MQTT_ADDR: mqtt://emqx:1883
      CLICKHOUSE_ADDR: http://clickhouse:8123/iot_metrics
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: 123456
      CLICKHOUSE_BATCH_INSERT_SIZE: 100
      CLICKHOUSE_BATCH_INSERT_PERIOD_SEC: 5
      DATABASE_ENDPOINT: postgres://postgres:postgres@postgres:5432/bms
      DEVICE_MODEL_CACHE_TTL_SEC: 600
    logging:
      options:
        max-size: '10m'
        max-file: '3'
  metrics-devices-healthcheck:
    image: alpine
    networks:
      - bms-e2e-test-network
    depends_on:
      metrics-devices:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
        apk add --no-cache wget > /dev/null 2>&1 &&
        until wget -qO- http://metrics-devices:3334/api/health > /dev/null 2>&1; do
          echo 'Waiting for metrics-devices...';
          sleep 3;
        done;
        echo 'metrics-devices is healthy!'
      "
    restart: 'no'
  alert-manager-msb:
    image: lumivn/alert-manager-msb:__ALERT_MANAGER_VERSION__
    restart: unless-stopped
    ports:
      - '3335:3335'
    networks:
      - bms-e2e-test-network
    depends_on:
      iot-console-healthcheck:
        condition: service_completed_successfully
      metrics-devices-healthcheck:
        condition: service_completed_successfully
    environment:
      RUST_LOG: info
      HTTP_PORT: 3335
      POLLING_INTERVAL_SECONDS: 300
      JWT_SECRET: 'yywbg1pV00kil3qF59mzqqqQQu/3M1Eu+vOUOzxGdRA='
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/bms
      METRICS_GATEWAY_URL: http://metrics-devices:3334
      METRICS_GATEWAY_API_KEY: ''
      RUNTIME_STATE_IDX: 6
      METRICS_BATCH_SIZE: 500
    logging:
      options:
        max-size: '10m'
        max-file: '3'
  automation-cloud:
    image: lumivn/automation-cloud:__AUTOMATION_CLOUD_VERSION__
    restart: unless-stopped
    ports:
      - 19000:9000
    networks:
      - bms-e2e-test-network
    entrypoint: ['/application', 'worker']
    environment:
      RUST_LOG: info
      HTTP_ADDRESS: 0.0.0.0:9000
      DATABASE_ENDPOINT: postgres://postgres:postgres@postgres:5432/bms
      DATABASE_MIGRATION: false
    depends_on:
      db-init:
        condition: service_completed_successfully
    logging:
      options:
        max-size: '10m'
        max-file: '3'
  iot-proxy-gw:
    image: lumivn/bms-iot-proxy:__BMS_IOT_PROXY_VERSION__
    ports:
      - 8081:8081
    restart: unless-stopped
    networks:
      - bms-e2e-test-network
    depends_on:
      iot-console-healthcheck:
        condition: service_completed_successfully
      emqx:
        condition: service_healthy
    environment:
      TEMPLATE_PATH: /data/template
      DATABASE_URI: http://iot-console:3333
      DATABASE_MIGRATION: false
      MQTT_URI: mqtt://emqx:1883
      HTTP_ADDR: 0.0.0.0:8081
      DEVICE_STATE_URI: postgres://postgres:postgres@postgres:5432/bms
    volumes:
      - ./infra/config/template:/data/template:ro
    logging:
      options:
        max-size: '10m'
        max-file: '3'
  bms-api:
    image: lumivn/bms-api-msb:__BMS_API_VERSION__
    ports:
      - '3332:3332'
    networks:
      - bms-e2e-test-network
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      HTTP_PORT: '3332'
      DATABASE_ENDPOINT: 'postgres://postgres:postgres@postgres:5432/bms'
      REDIS_URL: 'redis://redis:6379'
      APP_ENV: 'development'
      PBAC_ENABLED: 'true'
      BMS_API_RUN_MIGRATIONS: false
      X_API_KEY: '8adXZMOB9wvjHg2iXDNfP1llOnVuFVVG'
      IOT_WEBHOOK_SECRET: '8adXZMOB9wvjHg2iXDNfP1llOnVuFVVG'
      JWT_SECRET: 'yywbg1pV00kil3qF59mzqqqQQu/3M1Eu+vOUOzxGdRA='
      JWT_ALGORITHM: 'HS256'
    restart: unless-stopped
    logging:
      options:
        max-size: '10m'
        max-file: '3'
  hc1:
    image: lumivn/iot-platform-hc:__IOT_PLATFORM_HC_VERSION__
    container_name: hc1
    depends_on:
      emqx:
        condition: service_healthy
    ports:
      - 8080:8080
    networks:
      bms-e2e-test-network:
        ipv4_address: 10.5.0.100
    command:
      - /application
      - --config-path
      - /app/config.toml
    volumes:
      - ./infra/config/hc1/macfile:/app/macfile:ro
      - ./infra/config/hc1/config.toml:/app/config.toml:ro
      - ./infra/config/scripts:/app/scripts

networks:
  bms-e2e-test-network:
    name: bms-e2e-test-network
    driver: bridge
    ipam:
      config:
        - subnet: 10.5.0.0/24
          gateway: 10.5.0.1
